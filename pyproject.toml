[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "training-on-broken-contexts"
version = "0.2.0"
description = "Source-loss auditing and training-example reconstruction for tool-augmented LLM post-training"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  {name = "Amir Reza Peimani", email = "amir.peimani@utoronto.ca"},
]
dependencies = [
  "datasets==4.8.4",
  "numpy==2.5.1",
  "pandas==3.0.5",
  "pyarrow==25.0.0",
  "transformers==5.14.1",
  "trl==1.9.2",
  "peft==0.20.0",
]

[project.urls]
Repository = "https://github.com/AmirRezaPeimani/when-supervision-outlives-support"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
